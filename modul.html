<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Modul Ajar Informatika SMA — Kurikulum Merdeka</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=Lora:ital,wght@0,400..700;1,400..700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F6F2E8; --paper-2:#EDE7D8; --paper-3:#FBF8F1;
    --ink:#232019; --ink-70:rgba(35,32,25,.72); --ink-55:rgba(35,32,25,.55);
    --ink-30:rgba(35,32,25,.32); --ink-12:rgba(35,32,25,.14);
    --board:#153029; --chalk:#EAE4D2; --chalk-dim:rgba(234,228,210,.52);
    --accent:#A8401F; --green:#2E6B4F; --gold:#D8B25C; --hl:#F0E2AC;
    --serif:'Lora',Georgia,serif; --disp:'Fraunces',Georgia,serif; --mono:'IBM Plex Mono',ui-monospace,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:var(--serif);background:var(--paper);color:var(--ink);font-size:16px;line-height:1.78;overflow-wrap:break-word}
  ::selection{background:var(--hl)}
  [hidden]{display:none!important}
  button{font-family:inherit;color:inherit}
  a{color:var(--accent)}
  kbd{font:600 10.5px var(--mono);border:1px solid var(--ink-30);border-bottom-width:2px;padding:1px 6px;border-radius:3px;background:var(--paper-3)}

  /* ---------- SIDEBAR ---------- */
  .sidebar{position:fixed;inset:0 auto 0 0;width:330px;background:var(--board);color:var(--chalk);
    display:flex;flex-direction:column;z-index:60;
    background-image:radial-gradient(rgba(255,255,255,.035) 1px,transparent 1.2px);background-size:24px 24px}
  .brand{padding:30px 26px 22px;border-bottom:1px solid rgba(234,228,210,.14)}
  .brand-kicker{font:600 10px var(--mono);letter-spacing:.24em;text-transform:uppercase;color:var(--gold);margin-bottom:10px}
  .brand-title{font:600 25px/1.18 var(--disp);letter-spacing:-.2px}
  .brand-title em{font-style:italic;font-weight:500}
  .search{margin:18px 26px 4px;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(234,228,210,.25)}
  .search svg{width:14px;height:14px;color:var(--chalk-dim);flex:none}
  .search input{flex:1;background:none;border:none;outline:none;color:var(--chalk);font:400 13px var(--mono);padding:9px 0;caret-color:var(--gold)}
  .search input::placeholder{color:var(--chalk-dim)}
  .search:focus-within{border-bottom-color:var(--gold)}
  .module-nav{flex:1;overflow-y:auto;padding:8px 0 16px;scrollbar-width:thin;scrollbar-color:rgba(234,228,210,.25) transparent}
  .module-nav::-webkit-scrollbar{width:7px}
  .module-nav::-webkit-scrollbar-thumb{background:rgba(234,228,210,.18);border-radius:4px}
  .nav-cap{font:600 10px var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--chalk-dim);padding:20px 26px 8px}
  .mod-item{display:grid;grid-template-columns:30px 1fr auto;gap:0 12px;align-items:start;width:100%;text-align:left;
    background:none;border:none;border-left:3px solid transparent;cursor:pointer;padding:10px 22px 11px 23px}
  .mod-item:hover{background:rgba(255,255,255,.05)}
  .mod-item.on{background:rgba(255,255,255,.07);border-left-color:var(--gold)}
  .mi-no{font:600 10.5px var(--mono);color:var(--chalk-dim);padding-top:4px}
  .mod-item.on .mi-no{color:var(--gold)}
  .mi-title{display:block;font:600 14.5px/1.35 var(--disp);letter-spacing:.1px}
  .mi-meta{display:block;font:500 10px var(--mono);color:var(--chalk-dim);margin-top:3px}
  .mi-state{padding-top:5px}
  .mi-state svg{width:13px;height:13px;color:var(--gold)}
  .mi-state .dot{display:block;width:6px;height:6px;border-radius:50%;background:var(--gold)}
  .nav-empty{padding:26px;font:italic 14px var(--serif);color:var(--chalk-dim)}
  .sidebar-foot{border-top:1px solid rgba(234,228,210,.14);padding:16px 26px 18px}
  .progress-line{height:4px;background:rgba(234,228,210,.14);margin-bottom:9px}
  .progress-line span{display:block;height:100%;width:0;background:var(--gold);transition:width .4s ease}
  .progress-text{font:500 10.5px var(--mono);letter-spacing:.06em;color:var(--chalk-dim)}
  .sf-tools{display:flex;gap:10px;margin-top:10px}
  .sf-btn{background:none;border:none;cursor:pointer;font:500 10px var(--mono);letter-spacing:.08em;
    color:var(--chalk-dim);text-decoration:underline;text-underline-offset:3px;padding:0}
  .sf-btn:hover{color:var(--gold)}

  /* ---------- MOBILE BAR ---------- */
  .mbar{display:none;position:sticky;top:0;z-index:55;background:var(--board);color:var(--chalk);padding:12px 16px;align-items:center;gap:12px}
  .mbar button{background:none;border:none;cursor:pointer;display:flex;padding:4px}
  .mbar svg{width:19px;height:19px}
  .mbar b{font:600 15px var(--disp)}
  .scrim{position:fixed;inset:0;background:rgba(20,18,14,.45);z-index:58;opacity:0;pointer-events:none;transition:opacity .25s}
  .scrim.show{opacity:1;pointer-events:auto}

  /* ---------- MAIN + TOOLBAR ---------- */
  .main{margin-left:330px;min-height:100vh}
  .toolbar{position:sticky;top:0;z-index:50;background:rgba(246,242,232,.94);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--ink-12);display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:9px 30px}
  .crumb{flex:1;min-width:200px;font:600 10.5px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-55)}
  .tb-actions{display:flex;gap:8px;flex-wrap:wrap}
  .tbtn{display:inline-flex;align-items:center;gap:7px;font:600 10.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;
    padding:8px 13px;border:1px solid var(--ink-30);background:transparent;cursor:pointer;border-radius:3px}
  .tbtn svg{width:13px;height:13px}
  .tbtn:hover{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .tbtn.accent{background:var(--accent);border-color:var(--accent);color:#FCF8EE}
  .tbtn.accent:hover{background:#8A3216;border-color:#8A3216}
  .tbtn.on{background:var(--green);border-color:var(--green);color:#FCF8EE}
  .tbtn.on:hover{background:#245A41;border-color:#245A41}
  .readprog{position:absolute;left:0;bottom:-1px;height:2px;background:var(--accent);width:0}
  .edit-tip{flex-basis:100%;display:none;align-items:center;gap:9px;font:italic 13px var(--serif);color:var(--ink-70);
    background:rgba(240,226,172,.4);border:1px solid rgba(168,64,31,.25);border-radius:3px;padding:7px 12px}
  .edit-tip svg{width:14px;height:14px;color:var(--accent);flex:none}
  body.editing .edit-tip{display:flex}

  /* ---------- BILAH PENYUNTING ---------- */
  .editbar{flex-basis:100%;display:flex;align-items:center;gap:3px;flex-wrap:wrap;padding:5px 0 1px}
  .eb-sep{width:1px;height:20px;background:var(--ink-12);margin:0 6px;flex:none}
  .editbar button{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:28px;height:28px;
    padding:0 6px;border:1px solid var(--ink-12);background:var(--paper-3);cursor:pointer;border-radius:3px}
  .editbar button:hover{border-color:var(--accent);color:var(--accent)}
  .editbar button svg{width:13px;height:13px}
  .editbar .eb-txt{font:600 11px var(--mono);letter-spacing:.04em}
  .editbar .eb-img{font:600 10.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;
    background:var(--accent);border-color:var(--accent);color:#FCF8EE;padding:0 12px}
  .editbar .eb-img:hover{background:#8A3216;border-color:#8A3216;color:#FCF8EE}

  /* ---------- LANDING ---------- */
  .landing{max-width:900px;margin:0 auto;padding:84px 48px 70px;animation:rise .5s ease both}
  .land-kicker{font:600 10.5px var(--mono);letter-spacing:.26em;text-transform:uppercase;color:var(--accent)}
  .land-title{font:600 clamp(32px,4.2vw,52px)/1.12 var(--disp);letter-spacing:-1px;margin:20px 0 22px;max-width:760px}
  .land-title em{font-style:italic;color:var(--accent);font-weight:500}
  .lede{font:17.5px/1.8 var(--serif);color:var(--ink-70);max-width:680px}
  .land-stats{display:flex;flex-wrap:wrap;border:1px solid var(--ink-12);background:var(--paper-3);margin:36px 0 50px}
  .stat{flex:1 1 150px;padding:16px 22px;border-right:1px solid var(--ink-12)}
  .stat:last-child{border-right:none}
  .stat b{display:block;font:600 30px/1 var(--disp)}
  .stat span{font:500 10px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-55)}
  .toc-cap{font:600 11px var(--mono);letter-spacing:.24em;text-transform:uppercase;color:var(--ink-55);
    border-bottom:1px solid var(--ink);padding-bottom:12px;margin-bottom:6px}
  .toc-group{font:600 10px var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--accent);padding:22px 2px 8px}
  .toc-row{display:flex;align-items:baseline;gap:12px;width:100%;background:none;border:none;text-align:left;
    padding:12px 2px;cursor:pointer;font-family:inherit}
  .toc-row:hover .toc-t{color:var(--accent)}
  .toc-no{font:600 11px var(--mono);color:var(--accent);min-width:26px}
  .toc-t{font:600 18px/1.3 var(--disp);letter-spacing:.1px}
  .toc-dots{flex:1;border-bottom:2px dotted var(--ink-30);transform:translateY(-5px);min-width:30px}
  .toc-m{font:500 10.5px var(--mono);color:var(--ink-55);white-space:nowrap}
  .land-hint{font:italic 14px var(--serif);color:var(--ink-70);margin-top:34px;max-width:680px}
  .land-bits{margin-top:64px;padding-top:20px;border-top:1px solid var(--ink-12);
    font:400 11.5px var(--mono);color:var(--ink-55);letter-spacing:.04em}

  /* ---------- DOKUMEN ---------- */
  @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  .doc{max-width:860px;margin:0 auto;padding:54px 52px 30px;animation:rise .45s ease both}
  .print-head{display:none;justify-content:space-between;font:500 10px var(--mono);letter-spacing:.16em;
    text-transform:uppercase;color:#444;border-bottom:1px solid #999;padding-bottom:8px;margin-bottom:26px}
  .doc-head{margin-bottom:8px}
  .dh-top{display:flex;gap:36px;align-items:flex-start;border-bottom:1px solid var(--ink);padding-bottom:32px}
  .dh-num .cap{font:600 10px var(--mono);letter-spacing:.3em;text-transform:uppercase;color:var(--ink-55);margin-bottom:12px}
  .dh-num .n{font:700 118px/0.82 var(--disp);letter-spacing:-5px;color:var(--accent)}
  @supports(-webkit-text-stroke:1px black){.dh-num .n{color:transparent;-webkit-text-stroke:2.5px var(--accent)}}
  .dh-right{flex:1;min-width:0}
  .dh-kicker{font:600 10.5px var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--ink-55);
    display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
  .chip{font:600 9px var(--mono);letter-spacing:.14em;padding:3px 8px;border:1px solid;border-radius:2px}
  .chip-local{color:var(--accent);border-color:var(--accent);background:rgba(168,64,31,.07)}
  .chip-done{color:var(--green);border-color:var(--green);background:rgba(46,107,79,.08)}
  .dh-title{font:600 clamp(26px,3vw,38px)/1.18 var(--disp);letter-spacing:-.4px;margin-bottom:14px}
  .dh-ringkas{font:italic 16.5px/1.65 var(--serif);color:var(--ink-70);max-width:600px}
  .meta-strip{display:flex;flex-wrap:wrap;border:1px solid var(--ink-12);border-top:none;background:var(--paper-3)}
  .ms{flex:1 1 170px;padding:13px 17px;border-right:1px solid var(--ink-12);min-width:150px}
  .ms:last-child{border-right:none}
  .ms .k{font:600 9.5px var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--ink-55);margin-bottom:4px}
  .ms .v{font:600 14px/1.4 var(--disp)}
  .band{margin-top:86px;background:var(--paper-2);border:1px solid var(--ink-12);padding:20px 26px;
    display:flex;gap:20px;align-items:center;break-inside:avoid}
  .band .b-no{font:600 13px var(--mono);color:var(--accent);border:1.5px solid var(--accent);padding:7px 11px;flex:none}
  .band h2{font:600 24px var(--disp);letter-spacing:-.2px}
  .band .b-cap{margin-left:auto;font:italic 14px var(--serif);color:var(--ink-55);text-align:right}
  .sec{margin-top:56px}
  .sub-h{display:flex;align-items:baseline;gap:13px;margin:0 0 20px}
  .sub-no{font:600 12px var(--mono);color:var(--accent);letter-spacing:.1em}
  .sub-t{font:600 21px var(--disp);letter-spacing:-.2px}
  .sec-intro{font:italic 15px var(--serif);color:var(--ink-70);margin-bottom:20px}

  .id-grid{display:grid;grid-template-columns:1fr 1fr;column-gap:36px;border-top:1px solid var(--ink-12)}
  .id-row{padding:13px 2px 12px 0;border-bottom:1px solid var(--ink-12)}
  .id-row dt{font:600 9.5px var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--ink-55);margin-bottom:5px}
  .id-row dd{font:15px/1.6 var(--serif)}
  .cp-item{margin-bottom:24px}
  .cp-e{font:600 10px var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--accent);
    display:flex;align-items:center;gap:10px;margin-bottom:8px}
  .cp-e::after{content:"";flex:1;height:1px;background:var(--ink-12)}
  .cp-t{font:italic 16.5px/1.7 var(--serif);padding-left:18px;border-left:3px solid var(--accent);color:#2A2620}
  .tp{display:grid;grid-template-columns:54px 1fr;gap:16px;padding:15px 0;border-bottom:1px solid var(--ink-12)}
  .tp:first-child{border-top:1px solid var(--ink-12)}
  .tp-no{font:600 29px/1.1 var(--disp);color:var(--accent)}
  .tp p{font:15.5px/1.72 var(--serif);padding-top:4px}
  .pb-list{display:grid;gap:13px}
  .pb{background:var(--paper-2);border-left:3px solid var(--accent);padding:17px 22px;font:italic 17.5px/1.62 var(--serif)}
  .pm{display:grid;grid-template-columns:110px 1fr;gap:16px;padding:17px 2px;border-bottom:1px dotted var(--ink-30)}
  .pm-no{font:600 10px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-55);padding-top:7px}
  .pm-q{font:500 18.5px/1.5 var(--disp)}

  /* kegiatan */
  .pert{border:1px solid var(--ink-12);background:var(--paper-3);margin-bottom:16px;break-inside:avoid}
  .pert-head{width:100%;display:flex;align-items:center;gap:14px;padding:15px 20px 12px;background:none;border:none;text-align:left;cursor:pointer}
  .pert-no{font:600 10.5px var(--mono);color:var(--accent);letter-spacing:.12em;text-transform:uppercase;white-space:nowrap}
  .pert-judul{font:600 16.5px var(--disp);flex:1;min-width:0}
  .pert-menit{font:500 10.5px var(--mono);color:var(--ink-55);display:flex;gap:6px;align-items:center;white-space:nowrap}
  .pert-menit svg{width:12px;height:12px}
  .pert-head .chev{width:16px;height:16px;color:var(--ink-55);transition:transform .35s;flex:none}
  .pert.open .chev{transform:rotate(180deg)}
  .timebar{display:flex;gap:3px;padding:0 20px 10px}
  .tb-seg{height:8px;min-width:8px}
  .c-p{background:#B7AD93}.c-i{background:var(--accent)}.c-t{background:var(--green)}
  .tb-legend{display:flex;gap:18px;flex-wrap:wrap;padding:0 20px 14px;font:500 10px var(--mono);color:var(--ink-55)}
  .tb-legend span{display:flex;align-items:center;gap:6px}
  .tb-legend b{width:8px;height:8px;flex:none}
  .pert-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s ease}
  .pert-inner{overflow:hidden}
  .pert.open .pert-body{grid-template-rows:1fr}
  .phase{padding:2px 20px 12px}
  .phase h4{font:600 10px var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--ink-55);
    display:flex;align-items:center;gap:12px;margin:8px 0}
  .phase h4::after{content:"";flex:1;height:1px;background:var(--ink-12)}
  .dash-list,.inti-list{list-style:none}
  .dash-list li,.inti-list li{position:relative;padding:7px 0 7px 30px;font:15px/1.7 var(--serif)}
  .dash-list li::before{content:"";position:absolute;left:4px;top:19px;width:11px;height:2px;background:var(--ink-30)}
  .inti-list{counter-reset:step}
  .inti-list li::before{content:counter(step);counter-increment:step;position:absolute;left:0;top:8px;
    font:600 11px var(--mono);color:var(--accent);width:20px;text-align:center}
  .phase-inti{background:rgba(168,64,31,.05);margin:0 12px;padding:12px 16px 8px;border:1px solid rgba(168,64,31,.18)}
  .phase-inti h4{color:var(--accent)}
  .pert-ases{display:flex;gap:10px;align-items:baseline;padding:13px 20px 16px;border-top:1px dotted var(--ink-30);
    font:italic 13.5px var(--serif);color:var(--ink-70)}
  .pert-ases b{font:600 9.5px var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--ink-55);font-style:normal}

  /* materi */
  .m-h{font:600 19px var(--disp);letter-spacing:-.1px;margin:36px 0 12px;display:flex;align-items:center;gap:11px;break-after:avoid}
  .m-h::before{content:"";width:9px;height:9px;background:var(--accent);flex:none}
  .m-p{margin:13px 0;font:16px/1.8 var(--serif)}
  .m-p.lead::first-letter{font:600 52px/0.85 var(--disp);float:left;padding:7px 10px 0 0;color:var(--accent)}
  .m-ul{list-style:none;margin:13px 0}
  .m-ul li{position:relative;padding:7px 0 7px 28px;font:15.5px/1.72 var(--serif)}
  .m-ul li::before{content:"";position:absolute;left:4px;top:19px;width:11px;height:2px;background:var(--accent)}
  .m-note{display:grid;grid-template-columns:120px 1fr;gap:16px;background:rgba(216,178,92,.2);
    border:1px solid rgba(168,64,31,.22);padding:16px 20px;margin:18px 0;break-inside:avoid}
  .n-cap{font:600 9.5px var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--accent);padding-top:4px}
  .n-t{font:italic 15.5px/1.68 var(--serif)}
  .m-table{width:100%;border-collapse:collapse;margin:18px 0;font-size:14px}
  .m-table th{font:600 10px var(--mono);letter-spacing:.1em;text-transform:uppercase;text-align:left;
    color:var(--ink-55);border-bottom:2px solid var(--ink);padding:8px 10px}
  .m-table td{border-bottom:1px solid var(--ink-12);padding:8px 10px;vertical-align:top}
  .m-table tbody tr:nth-child(even) td{background:rgba(35,32,25,.03)}
  .m-code{font:400 12.5px/1.75 var(--mono);background:var(--board);color:var(--chalk);
    border-left:3px solid var(--gold);padding:16px 20px;margin:18px 0;overflow-x:auto;white-space:pre;
    background-image:radial-gradient(rgba(255,255,255,.035) 1px,transparent 1.2px);background-size:22px 22px}

  /* gambar tersisip */
  .m-fig{position:relative;margin:22px 0;break-inside:avoid}
  .m-fig img{display:block;max-width:100%;height:auto;border:1px solid var(--ink-12);background:#fff}
  .m-fig[data-align="left"] img{margin:0 auto 0 0}
  .m-fig[data-align="center"] img{margin:0 auto}
  .m-fig[data-align="right"] img{margin:0 0 0 auto}
  .m-fig figcaption{font:italic 13px/1.6 var(--serif);color:var(--ink-55);margin-top:8px;text-align:center}
  body.editing .m-fig{outline:1px dashed rgba(168,64,31,.35);outline-offset:6px}
  body.editing .m-fig img{cursor:pointer}
  .fig-resize{display:none;position:absolute;right:-7px;bottom:-7px;width:13px;height:13px;
    background:var(--accent);border:2px solid var(--paper-3);cursor:nwse-resize;z-index:5}
  body.editing .fig-resize{display:block}
  body.noselect{user-select:none;-webkit-user-select:none}

  /* asesmen */
  .as-block{border:1px solid var(--ink-12);margin-bottom:15px;background:var(--paper-3)}
  .as-head{display:flex;justify-content:space-between;align-items:baseline;gap:14px;padding:12px 18px;
    background:var(--paper-2);border-bottom:1px solid var(--ink-12)}
  .as-name{font:600 16.5px var(--disp)}
  .as-when{font:italic 13px var(--serif);color:var(--ink-55)}
  .as-body{padding:6px 18px 16px}
  .as-row{display:grid;grid-template-columns:110px 1fr;gap:14px;padding:9px 0;border-bottom:1px dashed var(--ink-12)}
  .as-row span{font:600 9.5px var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--ink-55);padding-top:5px}
  .as-row p{font:15px/1.65 var(--serif)}
  .as-contoh{padding-top:12px}
  .as-contoh .cap{font:600 9.5px var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
  .as-contoh ol{padding-left:22px}
  .as-contoh li{font:15px/1.68 var(--serif);padding:4px 0}
  .rubrik-wrap{margin-top:28px}
  .rubrik-cap{font:600 10px var(--mono);letter-spacing:.22em;text-transform:uppercase;color:var(--ink-55);
    border-bottom:1px solid var(--ink);padding-bottom:9px;margin-bottom:4px}
  .rubrik{width:100%;border-collapse:collapse;font-size:13px;line-height:1.55}
  .rubrik thead{display:table-header-group}
  .rubrik th{border-bottom:2px solid var(--ink);padding:9px 10px;text-align:left;vertical-align:bottom}
  .rubrik thead th{font:600 9.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-55)}
  .rubrik thead .lv{display:block;font-style:normal;font-size:9px;color:var(--accent);margin-top:3px}
  .rubrik tbody th{font:600 14.5px/1.4 var(--disp);border-bottom:1px solid var(--ink-12);padding:10px}
  .rubrik tbody td{border-bottom:1px solid var(--ink-12);padding:9px 10px;vertical-align:top;font:13.5px/1.55 var(--serif)}
  .rubrik tbody tr:nth-child(even) td,.rubrik tbody tr:nth-child(even) th{background:rgba(35,32,25,.03)}

  /* refleksi */
  .ref-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
  .ref-panel{padding:26px 26px 18px}
  .ref-guru{background:var(--board);color:var(--chalk);border-left:4px solid var(--gold);
    background-image:radial-gradient(rgba(255,255,255,.035) 1px,transparent 1.2px);background-size:22px 22px}
  .ref-siswa{background:var(--paper-2);border:1px solid var(--ink-12);border-left:4px solid var(--accent)}
  .ref-cap{font:600 9.5px var(--mono);letter-spacing:.24em;text-transform:uppercase;margin-bottom:12px}
  .ref-guru .ref-cap{color:var(--gold)}
  .ref-siswa .ref-cap{color:var(--accent)}
  .ref-h{font:italic 500 18px/1.35 var(--disp);margin-bottom:12px}
  .ref-panel ul{list-style:none}
  .ref-panel li{position:relative;padding:9px 0 9px 22px;font:italic 14.5px/1.65 var(--serif)}
  .ref-panel li::before{content:"";position:absolute;left:2px;top:19px;width:8px;height:2px}
  .ref-guru li{border-bottom:1px dashed rgba(234,228,210,.22)}
  .ref-guru li::before{background:var(--gold)}
  .ref-siswa li{border-bottom:1px dashed var(--ink-30)}
  .ref-siswa li::before{background:var(--accent)}

  /* pager */
  .pager{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:72px;border-top:3px double var(--ink);padding-top:24px}
  .pg-btn{border:1px solid var(--ink-12);background:var(--paper-3);padding:15px 18px;text-align:left;cursor:pointer;display:block}
  .pg-btn:hover{border-color:var(--accent);background:var(--paper-2)}
  .pg-next{text-align:right}
  .pg-lab{display:block;font:600 9.5px var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--ink-55);margin-bottom:5px}
  .pg-tit{display:block;font:600 16px/1.35 var(--disp)}
  .doc-foot{margin-top:30px;font:italic 13px/1.7 var(--serif);color:var(--ink-55);text-align:center}

  /* rail */
  .toc-rail{position:fixed;right:26px;top:110px;width:225px;font-family:var(--mono);font-size:11px;display:none;z-index:10}
  @media(min-width:1500px){.toc-rail{display:block}}
  .rail-cap{font:600 9.5px var(--mono);letter-spacing:.22em;text-transform:uppercase;color:var(--ink-55);margin-bottom:10px}
  .rail-grp{font:600 9.5px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--accent);padding:12px 0 5px}
  .toc-rail a{display:block;padding:5px 0 5px 13px;color:var(--ink-70);text-decoration:none;border-left:1px solid var(--ink-12)}
  .toc-rail a:hover{color:var(--ink)}
  .toc-rail a.on{color:var(--accent);border-left:2px solid var(--accent);padding-left:12px;font-weight:600}

  /* toast */
  .toasts{position:fixed;right:24px;bottom:24px;z-index:100;display:flex;flex-direction:column;gap:10px;max-width:360px}
  .toast{display:flex;align-items:flex-start;gap:11px;background:var(--board);color:var(--chalk);
    border-left:3px solid var(--gold);padding:13px 17px;font:14px/1.55 var(--serif);
    box-shadow:0 8px 26px rgba(14,20,16,.3);animation:tin .35s ease both}
  .toast svg{width:15px;height:15px;color:var(--gold);flex:none;margin-top:3px}
  .toast.out{animation:tout .35s ease both}
  @keyframes tin{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  @keyframes tout{to{opacity:0;transform:translateY(10px)}}

  /* bilah melayang gambar & tabel */
  .fbar{position:fixed;z-index:80;display:flex;align-items:center;gap:2px;padding:5px;background:var(--board);color:var(--chalk);
    border:1px solid rgba(234,228,210,.25);border-radius:3px;box-shadow:0 10px 30px rgba(14,20,16,.35);
    max-width:calc(100vw - 16px);flex-wrap:wrap}
  .fbar button{display:inline-flex;align-items:center;gap:5px;font:600 10px var(--mono);letter-spacing:.05em;
    padding:5px 8px;background:none;border:none;color:var(--chalk);cursor:pointer;border-radius:2px;white-space:nowrap}
  .fbar button:hover{background:rgba(255,255,255,.14);color:#fff}
  .fbar button svg{width:12px;height:12px}
  .fbar .fb-sep{width:1px;align-self:stretch;background:rgba(234,228,210,.22);margin:0 4px}

  /* modal */
  .modal-scrim{position:fixed;inset:0;z-index:90;background:rgba(20,18,14,.55);display:flex;align-items:center;justify-content:center;padding:20px;animation:tin .25s ease both}
  .modal{background:var(--paper-3);border:1px solid var(--ink);max-width:480px;width:100%;max-height:86vh;overflow-y:auto;
    box-shadow:0 24px 60px rgba(14,20,16,.4);padding:22px 26px}
  .modal-head{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--ink);padding-bottom:10px;margin-bottom:16px}
  .modal-head h3{font:600 21px var(--disp);letter-spacing:-.2px}
  .modal-head button{background:none;border:none;cursor:pointer;display:flex;padding:4px}
  .modal-head svg{width:16px;height:16px;color:var(--ink-55)}
  .seg-tabs{display:flex;border:1px solid var(--ink-30);margin-bottom:16px}
  .seg-tabs .seg{flex:1;padding:8px;background:var(--paper);border:none;cursor:pointer;
    font:600 10px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-55)}
  .seg-tabs .seg.on{background:var(--board);color:var(--chalk)}
  .dropzone{display:flex;flex-direction:column;align-items:center;gap:6px;border:1.5px dashed var(--ink-30);
    padding:26px 18px;text-align:center;cursor:pointer;background:var(--paper)}
  .dropzone svg{width:22px;height:22px;color:var(--accent)}
  .dropzone b{font:600 15px var(--disp)}
  .dropzone span{font:400 11.5px var(--mono);color:var(--ink-55)}
  .dropzone.over,.dropzone:hover{border-color:var(--accent);background:rgba(168,64,31,.05)}
  .f-label{display:block;font:600 9.5px var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--ink-55);margin:14px 0 6px}
  .f-input{width:100%;border:1px solid var(--ink-30);background:#fff;padding:9px 12px;font:14.5px var(--serif);color:var(--ink);outline:none}
  .f-input:focus{border-color:var(--accent)}
  .url-row{display:flex;gap:8px}
  .url-row .f-input{flex:1}
  .f-err{font:italic 13px var(--serif);color:var(--accent);margin-top:8px}
  .fig-prev{margin-top:14px;border:1px solid var(--ink-12);background:#fff;padding:10px;
    display:flex;flex-direction:column;align-items:center;gap:6px}
  .fig-prev img{max-height:200px;max-width:100%}
  .fig-meta{font:500 10.5px var(--mono);color:var(--ink-55)}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}

  /* sunting */
  [contenteditable="true"]{border-radius:2px}
  [contenteditable="true"]:hover{background:rgba(168,64,31,.05);outline:1px dashed var(--accent);outline-offset:3px}
  [contenteditable="true"]:focus{outline:2px solid var(--accent);outline-offset:3px;background:rgba(168,64,31,.04)}
  body.editing .m-p.lead::first-letter{padding-top:2px}

  /* responsif */
  @media(max-width:1024px){
    .mbar{display:flex}
    .sidebar{transform:translateX(-100%);transition:transform .3s ease;width:300px}
    .sidebar.open{transform:none}
    .main{margin-left:0}
    .toolbar{top:46px}
  }
  @media(max-width:720px){
    .doc{padding:38px 22px 20px}
    .landing{padding:56px 22px 50px}
    .dh-top{gap:18px}
    .dh-num .n{font-size:64px;letter-spacing:-3px}
    .dh-title{font-size:24px}
    .id-grid,.ref-grid{grid-template-columns:1fr}
    .pm{grid-template-columns:1fr;gap:4px}
    .tp{grid-template-columns:40px 1fr;gap:10px}
    .tp-no{font-size:22px}
    .m-note{grid-template-columns:1fr;gap:6px}
    .pager{grid-template-columns:1fr}
    .pg-next{text-align:left}
    .band{flex-wrap:wrap;gap:12px}
    .band .b-cap{margin-left:0;text-align:left;flex-basis:100%}
    .toolbar{padding:9px 16px}
    .toasts{left:16px;right:16px;max-width:none}
    .url-row{flex-wrap:wrap}
  }

  /* cetak */
  @media print{
    .sidebar,.mbar,.toolbar,.toc-rail,.toasts,.scrim,.pager,.edit-tip,.fbar,.modal-scrim{display:none!important}
    body{background:#fff;font-size:12.5px}
    .main{margin:0}
    .doc{max-width:100%;padding:0;animation:none}
    .print-head{display:flex!important}
    .band{margin-top:34px}
    .sec{margin-top:26px}
    .m-h,.sub-h,h4,.as-head{break-after:avoid}
    .pert{break-inside:avoid}
    .pert-body{grid-template-rows:1fr!important}
    .pert-inner{overflow:visible}
    .m-fig{break-inside:avoid}
    .m-fig img{max-width:100%}
    .m-code{white-space:pre-wrap;background:#1B1B18;color:#EEE;border-left:3px solid #999}
    .rubrik tbody tr{break-inside:avoid}
    .doc-head{padding-bottom:10px}
    @page{size:A4;margin:16mm 15mm}
  }
</style>
</head>
<body>

<div class="scrim" id="scrim"></div>

<script>
/* ================= IKON INLINE (tanpa CDN — aplikasi berjalan penuh secara luring) ================= */
const ICONS={

  "redo":'<path d="M15 14l5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/>',
  "bold":'<path d="M7 5h7a3.5 3.5 0 0 1 0 7H7z"/><path d="M7 12h8a3.5 3.5 0 0 1 0 7H7z"/>',

  "list":'<line x1="9" y1="6" x2="20" y2="6"/><line x1="9" y1="12" x2="20" y2="12"/><line x1="9" y1="18" x2="20" y2="18"/><line x1="4" y1="6" x2="4.01" y2="6"/><line x1="4" y1="12" x2="4.01" y2="12"/><line x1="4" y1="18" x2="4.01" y2="18"/>',

  "link":'<path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/>',

  "image":'<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9" r="1.5"/><path d="M21 16l-5-5L5 21"/>',
  "minus":'<line x1="5" y1="12" x2="19" y2="12"/>',
  "eraser":'<path d="M20 20H8.5L3.7 15.2a2 2 0 0 1 0-2.8L13.6 2.5l7.9 7.9-9.9 9.9"/><path d="M9 8l7 7"/>',
  "trash":'<polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>'
};
function renderIcons(scope){
  (scope||document).querySelectorAll("[data-lucide]").forEach(el=>{
    const body=ICONS[el.getAttribute("data-lucide")];
    if(!body) return;
    const cls=el.getAttribute("class");
    el.outerHTML='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"'+(cls?' class="'+cls+'"':'')+
      ' fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+body+'</svg>';
  });
}

/* ================= DATA MODUL ================= */

const MODULES = [
{
  id:"x1", no:"01", kelas:"X", fase:"E", semester:"Gasal",
  judul:"Penalaran Komputasional: Dekomposisi dan Pengenalan Pola",

  materiPokok:"Berpikir Komputasional",
  menit:90, alokasi:{jp:6, teks:"6 JP · 3 pertemuan × 2 JP"},
  model:"Discovery Learning — diskusi kelompok dan galeri karya",
  tags:["berpikir komputasional","dekomposisi","pola","abstraksi","algoritma"],

/* ================= UTILITAS: SANITASI & UNDUH ================= */
const OK_ATTR=new Set(["class","style","align","alt","src","href","target","rel","width","height","colspan","rowspan","start","type","title","data-align","dir"]);
function sanitizeHTML(html){
  const d=document.createElement("div"); d.innerHTML=html==null?"":String(html);
  d.querySelectorAll("script,style,iframe,object,embed,link,meta,base,form,input,select,textarea,button").forEach(n=>n.remove());
  d.querySelectorAll("*").forEach(el=>{
    [...el.attributes].forEach(at=>{
      const name=(at.name||"").toLowerCase();
      if(!OK_ATTR.has(name)||/^on/i.test(name)||/^\s*(javascript|vbscript)\s*:/i.test(at.value||"")) el.removeAttribute(at.name);
    });
    if(el.tagName==="A"){
      const h=(el.getAttribute("href")||"").trim();
      if(!/^(https?:|#|mailto:)/i.test(h)) el.setAttribute("href","#");
      el.setAttribute("rel","noopener");
    }
    if(el.tagName==="IMG"){
      const s=(el.getAttribute("src")||"").trim();
      if(!/^(https?:|data:image\/)/i.test(s)) el.removeAttribute("src");
    }
  });
  return d.innerHTML;
}
function download(name,content,mime){
  const b=new Blob([content],{type:mime});
  const u=URL.createObjectURL(b);
  const a=document.createElement("a");
  a.href=u; a.download=name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(u),4000);
}
const fmtKB=src=>Math.round(src.length*0.75/1024)+" KB";

function toast(msg,icon="info"){
  const t=document.createElement("div"); t.className="toast";
  t.innerHTML='<i data-lucide="'+icon+'"></i><span>'+msg+"</span>";
  $("toasts").appendChild(t); renderIcons(t);
  setTimeout(()=>{t.classList.add("out");setTimeout(()=>t.remove(),380)},4200);
}

/* ================= NAVIGASI ================= */
function matchMod(m,q){
  if(!q) return true;
  const hay=(m.judul+" "+m.ringkas+" "+m.materiPokok+" "+(m.tags||[]).join(" ")).toLowerCase();
  return hay.includes(q);
}
function renderNav(){
  const q=state.q.trim().toLowerCase(); let html="";
  GROUPS.forEach(g=>{
    const items=MODULES.filter(m=>m.kelas===g.k&&matchMod(m,q));
    if(!items.length) return;
    html+='<div class="nav-cap">'+g.label+"</div>";
    items.forEach(m=>{
      const st=done.has(m.id)?'<i data-lucide="check"></i>':(isModified(m.id)?'<span class="dot"></span>':"<span></span>");
      html+='<button class="mod-item '+(state.cur===m.id?"on":"")+'" data-open="'+m.id+'" title="'+m.judul+'">'+
        '<span class="mi-no">'+m.no+"</span>"+
        '<span class="mi-body"><span class="mi-title">'+m.judul+"</span>"+
        '<span class="mi-meta">'+m.alokasi.jp+" JP · Fase "+m.fase+"</span></span>"+
        '<span class="mi-state">'+st+"</span></button>";
    });
  });
  $("moduleNav").innerHTML=html||'<div class="nav-empty">Tidak ada modul yang cocok dengan pencarianmu.</div>';
  renderIcons(); updateProgress();
}
function updateProgress(){
  $("progFill").style.width=(done.size/MODULES.length*100)+"%";
  $("progText").textContent=done.size+" dari "+MODULES.length+" modul selesai diajarkan";
}

/* ================= RENDER DOKUMEN ================= */
function tbl(t,key){
  const h=t.h.map(x=>"<th>"+x+"</th>").join("");
  const rows=t.r.map(row=>"<tr>"+row.map(c=>"<td>"+c+"</td>").join("")+"</tr>").join("");
  return '<table class="m-table" data-e="'+key+'"><thead><tr>'+h+'</tr></thead><tbody>'+rows+"</tbody></table>";
}
function renderMateri(m){
  let out="",firstP=true;
  m.materi.forEach((b,i)=>{
    if(b.h) out+='<h3 class="m-h" data-e="mat-'+i+'-h">'+b.h+"</h3>";
    else if(b.p!=null){out+='<p class="m-p'+(firstP?" lead":"")+'" data-e="mat-'+i+'">'+b.p+"</p>";firstP=false;}
    else if(b.ul) out+='<ul class="m-ul" data-e="mat-'+i+'">'+b.ul.map(t=>"<li>"+t+"</li>").join("")+"</ul>";
    else if(b.note) out+='<div class="m-note"><div class="n-cap">'+(b.label||"Kotak Konsep")+'</div><div class="n-t" data-e="mat-'+i+'">'+b.note+"</div></div>";
    else if(b.code) out+='<pre class="m-code" data-e="mat-'+i+'">'+esc(b.code)+"</pre>";
    else if(b.table) out+=tbl(b.table,"mat-"+i);
  });
  return out;
}

/* ================= EDISI LOKAL ================= */
function applyEdits(root,modId){
  root.querySelectorAll("[data-e]").forEach(el=>{
    const v=edits[modId+"::"+el.dataset.e];
    if(v!=null) el.innerHTML=sanitizeHTML(v);
  });
}
function collectVals(){
  const o={};
  view.querySelectorAll("[data-e]").forEach(el=>{
    o[el.dataset.e]=el.innerHTML.replace(/<span class="fig-resize"[^>]*>\s*<\/span>/g,"");
  });
  return o;
}
function enterEdit(){
  state.editing=true; document.body.classList.add("editing");
  lastRange=null; hideBars();
  view.querySelectorAll("[data-e]").forEach(el=>el.setAttribute("contenteditable","true"));
  view.querySelectorAll(".m-fig").forEach(f=>{
    if(!f.querySelector(".fig-resize")){
      const s=document.createElement("span"); s.className="fig-resize"; f.appendChild(s);
    }
  });
  renderToolbar();
  toast("Mode sunting aktif — teks, tabel, tautan, dan gambar dapat diubah atau disisipkan.","pencil");
}
function saveEdits(){
  const id=state.cur, cur=collectVals(); let n=0;
  Object.keys(cur).forEach(k=>{
    const ck=id+"::"+k;
    if(cur[k]!==pristine[k]){edits[ck]=cur[k];n++;}
    else if(edits[ck]!=null) delete edits[ck];
  });
  persist();
  state.editing=false; document.body.classList.remove("editing");
  renderNav(); renderDoc();
  n>0?toast("Tersimpan — "+n+" bagian diperbarui di perangkat ini.","save")
     :toast("Tidak ada perubahan untuk disimpan.","info");
}
function cancelEdit(){
  state.editing=false; document.body.classList.remove("editing");
  renderNav(); renderDoc();
  toast("Penyuntingan dibatalkan.","x");
}
function resetModule(){
  const id=state.cur; let had=false;
  Object.keys(edits).forEach(k=>{if(k.startsWith(id+"::")){delete edits[k];had=true;}});
  if(had){persist();renderNav();renderToolbar();renderDoc();
    toast("Perubahan lokal dibuang — dokumen kembali ke versi asli.","rotate-ccw");}
  else toast("Tidak ada perubahan lokal pada modul ini.","info");
}

  const clone=el.cloneNode(true);

    "h1{font-size:22pt}h2{font-size:16pt}h3{font-size:13pt}p{margin:0 0 8pt}"+
    "table{border-collapse:collapse;width:100%;margin:8pt 0}th,td{border:1px solid #8a8377;padding:5pt 7pt;vertical-align:top;font-size:10pt}"+
    "pre{font-family:Consolas,'Courier New',monospace;font-size:9.5pt;background:#eee;padding:8pt;border-left:3pt solid #999}"+
    "figure{margin:10pt 0}figure img{max-width:100%}figcaption{font-style:italic;color:#666;font-size:9pt;text-align:center}"+
    "ul,ol{margin:0 0 8pt 16pt}a{color:#A8401F}";

    "<title>"+esc(m.judul)+"</title><style>"+css+"</style></head><body>"+clone.innerHTML+"</body></html>";
  download("Modul-"+m.no+"-"+slug(m.judul)+".doc",html,"application/msword");
  toast("Dokumen Word diunduh — buka di pengolah kata untuk kop sekolah dan tanda tangan.","file-text");
}
function doBackup(){
  download("modul-ajar-informatika-cadangan.json",
    JSON.stringify({v:1,app:"modul-ajar-informatika",done:[...done],edits},null,1),"application/json");
  toast("Berkas cadangan diunduh — memuat semua penanda, suntingan, dan gambar yang disisipkan.","save");
}
function doRestore(file){
  const fr=new FileReader();
  fr.onload=()=>{
    let d; try{d=JSON.parse(fr.result)}catch(err){toast("Berkas cadangan tidak valid.","x");return;}
    if(!d||typeof d!=="object"||!Array.isArray(d.done)||typeof d.edits!=="object"){
      toast("Struktur cadangan tidak dikenali.","x");return;}
    done=new Set(d.done.filter(x=>typeof x==="string"&&MODULES.some(m=>m.id===x)));
    edits=d.edits;
    persist(); renderNav();
    if(state.cur) renderDoc(); else renderLanding();
    toast("Data dipulihkan — "+done.size+" penanda dan "+Object.keys(edits).length+" suntingan tersimpan.","check");
  };
  fr.readAsText(file);
}

/* ================= SELEKSI & PERINTAH PENYUNTING ================= */
function getRange(){
  const s=window.getSelection();
  if(s.rangeCount&&s.anchorNode&&view.contains(s.anchorNode)) return s.getRangeAt(0).cloneRange();
  return lastRange;
}
function editableFrom(r){
  if(!r) return null;
  let n=r.commonAncestorContainer; if(n.nodeType===3)n=n.parentNode;
  return (n.closest&&n.closest('[contenteditable="true"]'))||null;
}
function insertHTMLAtSel(html){
  const r=getRange();
  if(!r||!view.contains(r.commonAncestorContainer)){
    toast("Klik dulu posisi sisipan di dalam dokumen.","info");return false;}
  const ed=editableFrom(r);
  if(!ed){toast("Klik dulu di dalam area yang dapat disunting.","info");return false;}
  if(ed.tagName==="PRE"){toast("Gambar tidak dapat disisipkan di dalam blok kode.","x");return false;}
  ed.focus();
  const s=window.getSelection(); s.removeAllRanges(); s.addRange(r);
  const ok=document.execCommand("insertHTML",false,html);
  return ok!==false;
}
function runCmd(cmd,val){
  const r=getRange();
  const ed=r&&editableFrom(r);
  if(!r||!ed){toast("Klik dulu pada teks yang akan diformat.","info");return;}
  ed.focus();
  const s=window.getSelection(); s.removeAllRanges(); s.addRange(r);
  let v=val||null;
  if(cmd==="formatBlock") v="<"+val+">";
  document.execCommand(cmd,false,v);
}

/* ================= GAMBAR ================= */
function buildFigHTML(src,caption,align){
  align=align||"center";
  const alt=(caption||"ilustrasi modul").replace(/"/g,"&quot;");
  return '<figure class="m-fig" data-align="'+align+'"><img src="'+src+'" alt="'+alt+'" style="width:100%">'+
    (caption?'<figcaption>'+esc(caption)+"</figcaption>":"")+'<span class="fig-resize"></span></figure>';
}
function compressImage(file,cb){
  const fr=new FileReader();
  fr.onload=()=>{
    const src=fr.result, im=new Image();
    im.onload=()=>{
      const MAX=1200, sc=Math.min(1,MAX/Math.max(im.width,im.height));
      if(sc>=1&&(file.size<200000||src.length<260000)) return cb({src,w:im.width,h:im.height});
      const c=document.createElement("canvas");
      c.width=Math.max(1,Math.round(im.width*sc)); c.height=Math.max(1,Math.round(im.height*sc));
      const x=c.getContext("2d");
      x.fillStyle="#FFFFFF"; x.fillRect(0,0,c.width,c.height);
      x.drawImage(im,0,0,c.width,c.height);
      let out=c.toDataURL("image/jpeg",0.85);
      if(file.type==="image/png"&&sc>=1&&out.length>src.length) out=src;
      cb({src:out,w:c.width,h:c.height});
    };
    im.onerror=()=>cb({src,w:0,h:0});
    im.src=src;
  };
  fr.readAsDataURL(file);
}
function openImageModal(){
  lastRange=getRange()||lastRange;
  const wasReplace=!!(currentImg&&document.contains(currentImg));
  const body=`
   <div class="seg-tabs">
     <button type="button" class="seg on" data-tab="file">Unggah berkas</button>
     <button type="button" class="seg" data-tab="url">Tautan gambar</button>
   </div>
   <div id="tabFile">
     <label class="dropzone" id="dz">
       <i data-lucide="image"></i>
       <b>Seret berkas gambar ke sini</b>
       <span>atau klik untuk memilih — JPG/PNG otomatis dikompresi (maks. sisi 1200 px)</span>
       <input type="file" id="imgFile" accept="image/*" hidden>
     </label>
   </div>
   <div id="tabUrl" hidden>
     <label class="f-label">Alamat gambar (URL)</label>
     <div class="url-row">
       <input class="f-input" id="imgUrl" type="text" placeholder="https://contoh.com/gambar.jpg" autocomplete="off">
       <button type="button" class="tbtn" id="btnUrlPrev">Pratampil</button>
     </div>
     <p class="f-err" id="urlErr" hidden>Tautan tidak dapat dimuat — periksa alamatnya (harus diawali https://).</p>
   </div>
   <div class="fig-prev" id="figPrev" hidden><img id="prevImg" alt="pratampilan"><div class="fig-meta" id="figMeta"></div></div>
   <label class="f-label">Keterangan gambar (opsional)</label>
   <input class="f-input" id="imgCap" type="text" placeholder="mis. Tabel kebenaran gerbang AND" autocomplete="off">
   <div class="modal-actions">
     <button type="button" class="tbtn" id="mBatal">Batal</button>
     <button type="button" class="tbtn accent" id="mSisip" disabled>${wasReplace?"Ganti gambar":"Sisipkan gambar"}</button>
   </div>`;
  openModal(wasReplace?"Ganti Gambar":"Sisipkan Gambar",body,bd=>{
    let pend=null;
    const setPend=p=>{
      pend=p;
      bd.querySelector("#mSisip").disabled=!p;
      const fp=bd.querySelector("#figPrev");
      if(!p){fp.hidden=true;return;}
      bd.querySelector("#prevImg").src=p.src;
      bd.querySelector("#figMeta").textContent=p.w?(p.w+" × "+p.h+" px · "+fmtKB(p.src)):"dimuat dari tautan";
      fp.hidden=false;
    };
    bd.querySelectorAll(".seg").forEach(t=>t.addEventListener("click",()=>{
      bd.querySelectorAll(".seg").forEach(x=>x.classList.toggle("on",x===t));
      bd.querySelector("#tabFile").hidden=t.dataset.tab!=="file";
      bd.querySelector("#tabUrl").hidden=t.dataset.tab!=="url";
      if(t.dataset.tab==="url") bd.querySelector("#imgUrl").focus();
    }));
    const dz=bd.querySelector("#dz"), fi=bd.querySelector("#imgFile");
    dz.addEventListener("click",e=>{if(e.target!==fi) fi.click();});
    fi.addEventListener("change",()=>{if(fi.files&&fi.files[0]) handleFile(fi.files[0]); fi.value="";});
    dz.addEventListener("dragover",e=>{e.preventDefault();dz.classList.add("over");});
    dz.addEventListener("dragleave",()=>dz.classList.remove("over"));
    dz.addEventListener("drop",e=>{
      e.preventDefault();dz.classList.remove("over");
      const f=e.dataTransfer.files&&e.dataTransfer.files[0]; if(f) handleFile(f);
    });
    function handleFile(f){
      if(!/^image\//.test(f.type)){toast("Berkas itu bukan gambar.","x");return;}
      compressImage(f,p=>{
        setPend(p);
        if(p.src.length>1400000)
          toast("Gambar cukup besar — pertimbangkan tautan agar hemat penyimpanan.","info");
      });
    }
    bd.querySelector("#btnUrlPrev").addEventListener("click",()=>{
      let u=bd.querySelector("#imgUrl").value.trim(); if(!u) return;
      if(!/^https?:\/\//i.test(u)) u="https://"+u;
      bd.querySelector("#imgUrl").value=u;
      bd.querySelector("#urlErr").hidden=true; setPend(null);
      const im=new Image();
      im.onload=()=>setPend({src:u,w:im.width,h:im.height});
      im.onerror=()=>{bd.querySelector("#urlErr").hidden=false;};
      im.src=u;
    });
    bd.querySelector("#mBatal").addEventListener("click",()=>closeModal(true));
    bd.querySelector("#mSisip").addEventListener("click",()=>{
      if(!pend) return;
      const cap=bd.querySelector("#imgCap").value.trim();
      closeModal(false);
      if(wasReplace&&currentImg&&document.contains(currentImg)){
        currentImg.src=pend.src;
        toast("Gambar diganti.","image");
      }else{
        const ok=insertHTMLAtSel(buildFigHTML(pend.src,cap));
        if(ok) toast("Gambar disisipkan — klik gambar untuk mengatur, seret pegangan merah untuk mengubah ukuran.","image");
      }
    });
  });
}
function imgBarAction(act,arg){
  if(!currentImg||!document.contains(currentImg)){hideImgBar();return;}
  const fig=currentImg.closest(".m-fig");
  if(act==="align") fig.setAttribute("data-align",arg);
  else if(act==="width") currentImg.style.width=arg;
  else if(act==="replace"){openImageModal();return;}
  else if(act==="delete"){fig.remove();hideImgBar();toast("Gambar dihapus.","trash");return;}
  placeImgBar();
}

/* ================= TABEL ================= */
function tableOp(op){
  const cell=currentCell;
  if(!cell||!document.contains(cell)){hideTblBar();return;}
  const tr=cell.parentElement, table=tr.closest("table");
  if(!table) return;
  const idx=Math.max(0,[...tr.children].indexOf(cell));
  if(op==="row+"){
    const nr=document.createElement("tr");
    [...tr.children].forEach(c=>{
      const t=document.createElement(c.tagName.toLowerCase());
      t.innerHTML="&nbsp;"; nr.appendChild(t);
    });
    tr.after(nr);
  }else if(op==="row-"){
    if(table.querySelectorAll("tr").length>2) tr.remove();
    else toast("Tabel minimal menyisakan satu baris.","info");
  }else if(op==="col+"){
    table.querySelectorAll("tr").forEach(r=>{
      const ref=r.children[idx]||r.lastElementChild;
      if(ref){const t=document.createElement(ref.tagName.toLowerCase()); t.innerHTML="&nbsp;"; ref.after(t);}
    });
  }else if(op==="col-"){
    const anyLonger=[...table.querySelectorAll("tr")].some(r=>r.children.length>1);
    if(!anyLonger){toast("Tabel minimal menyisakan satu kolom.","info");return;}
    table.querySelectorAll("tr").forEach(r=>{
      const c=r.children[idx];
      if(c&&r.children.length>1) c.remove();
    });
  }
  hideTblBar();
}

/* ================= TAUTAN ================= */
function openLinkModal(){
  lastRange=getRange()||lastRange;
  const selText=(lastRange&&lastRange.toString)?lastRange.toString().slice(0,120):"";
  const body=`
   <label class="f-label">Alamat tautan</label>
   <input class="f-input" id="lnkUrl" type="text" placeholder="https://contoh.com/halaman" autocomplete="off">

  openModal("Sisipkan Tautan",body,bd=>{

/* ================= MODAL ================= */
const modalScrim=$("modalScrim");
function openModal(title,html,onReady){
  $("modalTitle").textContent=title;
  $("modalBody").innerHTML=html;
  renderIcons($("modalBody"));
  modalScrim.hidden=false; modalOpen=true;
  if(onReady) onReady($("modalBody"));
}
function closeModal(dismiss){
  if(!modalOpen) return;
  modalScrim.hidden=true; modalOpen=false;
  const d=modalDismiss; modalDismiss=null;
  if(dismiss&&d) d();
}
 $("modalClose").addEventListener("click",()=>closeModal(true));
modalScrim.addEventListener("mousedown",e=>{if(e.target===modalScrim) closeModal(true);});

/* ================= BILAH MELAYANG ================= */
function placeBar(bar,rect){
  bar.hidden=false;
  const bw=bar.offsetWidth,bh=bar.offsetHeight;
  let left=Math.max(10,Math.min(rect.left,innerWidth-bw-10));
  let top=rect.top-bh-8;
  if(top<10) top=Math.min(innerHeight-bh-10,rect.bottom+8);
  bar.style.left=Math.round(left)+"px";
  bar.style.top=Math.round(Math.max(10,top))+"px";
}
function showImgBar(img){ currentImg=img; placeBar($("imgBar"),img.getBoundingClientRect()); }
function hideImgBar(){ $("imgBar").hidden=true; }
function placeImgBar(){
  if($("imgBar").hidden) return;
  if(currentImg&&document.contains(currentImg)) placeBar($("imgBar"),currentImg.getBoundingClientRect());
  else hideImgBar();
}
function showTblBar(cell){
  currentCell=cell; tblAnchor=cell.closest("table");
  placeBar($("tblBar"),tblAnchor.getBoundingClientRect());
}
function hideTblBar(){ $("tblBar").hidden=true; }
function placeTblBar(){
  if($("tblBar").hidden) return;
  if(tblAnchor&&document.contains(tblAnchor)) placeBar($("tblBar"),tblAnchor.getBoundingClientRect());
  else hideTblBar();
}
function hideBars(){ hideImgBar(); hideTblBar(); }

function startFigResize(e){
  const h=e.target.closest(".fig-resize"); if(!h) return;
  e.preventDefault();
  const fig=h.closest(".m-fig"), img=fig.querySelector("img");
  const figW=Math.max(1,fig.getBoundingClientRect().width);
  const startW=img.getBoundingClientRect().width, sx=e.clientX;
  document.body.classList.add("noselect");
  const move=ev=>{
    let pct=(startW+(ev.clientX-sx))/figW*100;
    pct=Math.max(8,Math.min(100,pct));
    img.style.width=pct.toFixed(1)+"%";
    if(currentImg===img) placeImgBar();
  };
  const up=()=>{
    document.removeEventListener("mousemove",move);
    document.removeEventListener("mouseup",up);
    document.body.classList.remove("noselect");
  };
  document.addEventListener("mousemove",move);
  document.addEventListener("mouseup",up);
}

/* ================= RAIL + SCROLL ================= */
function buildRail(){
  rail.innerHTML='<div class="rail-cap">Di halaman ini</div>'+
    '<div class="rail-grp">Informasi Umum</div>'+
    '<a href="#sec-ident">Identitas Modul</a><a href="#sec-cp">Capaian Pembelajaran</a>'+
    '<div class="rail-grp">Komponen Inti</div>'+
    '<a href="#sec-tp">Tujuan Pembelajaran</a><a href="#sec-pb">Pemahaman Bermakna</a>'+
    '<a href="#sec-pm">Pertanyaan Pemantik</a><a href="#sec-keg">Kegiatan Pembelajaran</a>'+
    '<a href="#sec-mat">Materi Pembelajaran</a><a href="#sec-as">Asesmen</a><a href="#sec-ref">Refleksi</a>';
  if(spy) spy.disconnect();
  if(typeof IntersectionObserver==="undefined") return;
  const links={};
  rail.querySelectorAll("a").forEach(a=>links[a.getAttribute("href").slice(1)]=a);
  spy=new IntersectionObserver(es=>{
    es.forEach(en=>{
      if(en.isIntersecting){
        rail.querySelectorAll("a.on").forEach(a=>a.classList.remove("on"));
        const l=links[en.target.id]; if(l) l.classList.add("on");
      }
    });
  },{rootMargin:"-90px 0px -76% 0px"});
  view.querySelectorAll("[data-spy]").forEach(s=>spy.observe(s));
}
window.addEventListener("scroll",()=>{
  placeImgBar(); placeTblBar();
  const d=$("docEl"), bar=$("readprog");
  if(!d||!bar) return;
  const total=d.offsetHeight-window.innerHeight+140;
  const y=Math.max(0,Math.min(window.scrollY-d.offsetTop,total));
  bar.style.width=(total>0?y/total*100:100)+"%";
},{passive:true});

/* ================= PEMANTAUAN SELEKSI ================= */
document.addEventListener("selectionchange",()=>{
  if(!state.editing) return;
  const s=window.getSelection();
  if(s.rangeCount&&s.anchorNode&&view.contains(s.anchorNode))
    lastRange=s.getRangeAt(0).cloneRange();
});

/* ================= EVENT GLOBAL ================= */
document.addEventListener("mousedown",e=>{
  const b=e.target.closest("#editbar button,.fbar button");
  if(b){e.preventDefault();return;}
  if(state.editing&&e.target.closest&&e.target.closest(".m-fig img")){e.preventDefault();return;}
  if(state.editing&&e.target.closest&&e.target.closest(".fig-resize")) startFigResize(e);
});
document.addEventListener("click",e=>{
  const cmd=e.target.closest("#editbar button[data-cmd]");
  if(cmd){runCmd(cmd.dataset.cmd,cmd.dataset.val);return;}
  const act=e.target.closest("#editbar button[data-act]");
  if(act){act.dataset.act==="image"?openImageModal():openLinkModal();return;}
  const ib=e.target.closest("#imgBar button");
  if(ib){imgBarAction(ib.dataset.act,ib.dataset.arg);return;}
  const tbB=e.target.closest("#tblBar button");
  if(tbB){tableOp(tbB.dataset.act);return;}
  const open=e.target.closest("[data-open]");
  if(open){openModule(open.dataset.open);
    if(innerWidth<=1024) closeDrawer(); return;}
  const head=e.target.closest(".pert-head");
  if(head&&!state.editing){
    const p=head.closest(".pert"), willOpen=!p.classList.contains("open");
    p.classList.toggle("open");
    head.setAttribute("aria-expanded",willOpen);
  }
});
view.addEventListener("click",e=>{
  if(!state.editing){hideBars();return;}
  const img=e.target.closest(".m-fig img");
  if(img) showImgBar(img); else hideImgBar();
  const cell=e.target.closest("td,th");
  if(cell&&cell.closest("table.m-table,table.rubrik")&&view.contains(cell)) showTblBar(cell);
  else hideTblBar();
});
view.addEventListener("paste",e=>{
  if(!state.editing) return;
  const cd=e.clipboardData; if(!cd) return;
  const items=cd.items||[];
  for(let i=0;i<items.length;i++){
    const it=items[i];
    if(it.kind==="file"&&it.type&&it.type.indexOf("image/")===0){
      e.preventDefault();
      const f=it.getAsFile(); if(!f) return;
      compressImage(f,p=>{
        if(insertHTMLAtSel(buildFigHTML(p.src,"")))
          toast("Gambar dari papan klip disisipkan — otomatis dikompresi.","image");
      });
      return;
    }
  }
  const t=e.target;
  if(t&&t.closest&&t.closest("pre")) return;
  const html=cd.getData&&cd.getData("text/html");
  if(html){ e.preventDefault(); insertHTMLAtSel(sanitizeHTML(html)); }
});

const searchInput=$("searchInput");
searchInput.addEventListener("input",()=>{state.q=searchInput.value;renderNav();});
document.addEventListener("keydown",e=>{
  if(modalOpen){ if(e.key==="Escape"){e.preventDefault();closeModal(true);} return; }
  if((e.ctrlKey||e.metaKey)&&(e.key==="s"||e.key==="S")){
    if(state.editing){e.preventDefault();saveEdits();} return;
  }
  if(state.editing&&e.key==="Enter"&&!e.shiftKey){
    const r=getRange(), ed=r&&editableFrom(r);
    if(ed){
      let n=r.startContainer; if(n.nodeType===3)n=n.parentNode;
      const inLi=n.closest&&n.closest("li");
      const inCell=n.closest&&n.closest("td,th");
      if(!inLi&&!inCell){
        e.preventDefault();
        ed.focus();
        const s=window.getSelection(); s.removeAllRanges(); s.addRange(r);
        if(!document.execCommand("insertLineBreak"))
          document.execCommand("insertHTML",false,"<br>");
        return;
      }
    }
  }
  const a=document.activeElement,
        typing=a&&(a.tagName==="INPUT"||a.tagName==="TEXTAREA"||a.isContentEditable);
  if(e.key==="/"&&!typing){e.preventDefault();searchInput.focus();}
  else if(e.key==="Escape"){
    if(state.editing) cancelEdit();
    else if(sidebar.classList.contains("open")) closeDrawer();
    else if(a===searchInput) searchInput.blur();
  }
});
window.addEventListener("beforeunload",e=>{
  if(state.editing){e.preventDefault();e.returnValue="";}
});
function closeDrawer(){sidebar.classList.remove("open");$("scrim").classList.remove("show");}
 $("btnMenu").addEventListener("click",()=>{sidebar.classList.add("open");$("scrim").classList.add("show");});
 $("scrim").addEventListener("click",closeDrawer);
 $("btnBackup").addEventListener("click",doBackup);
 $("btnRestore").addEventListener("click",()=>$("fileRestore").click());
 $("fileRestore").addEventListener("change",e=>{
  const f=e.target.files&&e.target.files[0]; e.target.value="";
  if(f) doRestore(f);
});

    '</b>. Muat ulang halaman; bila berlanjut, buka konsol peramban (F12) untuk rincian galat.</p></div>';
}
